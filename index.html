<style>
/* Layout: one-screen handheld. Top strip, LCD in a bezel, 6-column top/function pad, 5-column number pad.
   Single dark device look on purpose (a calculator body), so no light theme. */
:root {
  --page: #0d0e10; --body: #1a1c1f; --body2: #222529; --bezel: #08090a;
  --key: #34373c; --key-hi: #4a4e55; --key-lo: #24262a; --key-fg: #f2f3f5;
  --gold: #d9b45f; --gold-key: #c9ad6d; --label: #c9ccd1; --muted: #80858d;
  --lcdbg: #c4cdb9; --ink: rgba(14, 22, 10, .82);
  --lcd-font: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ui-font: "IBM Plex Sans Condensed", "Arial Narrow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--key-fg); font-family: var(--ui-font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 6px;
  box-sizing: border-box; display: flex; justify-content: center; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#dev {
  width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(180deg, var(--body2), var(--body) 30%); border-radius: 22px; padding: 10px 10px 6px; box-sizing: border-box;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.5);
}
#top { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px; }
#top .model { font-weight: 600; font-size: 13px; letter-spacing: .04em; color: var(--label); }
#top .ed { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#bezel { background: var(--bezel); border-radius: 12px; padding: 9px; flex: 0 0 auto; }
#lcd { --u: 1.7px; position: relative; width: 100%; aspect-ratio: 192 / 76; background: var(--lcdbg); color: var(--ink); font-family: var(--lcd-font);
  border-radius: 3px; overflow: hidden; box-shadow: inset 0 2px 6px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
#lcd.off { background: #aeb6a5; }
#lcd.off * { visibility: hidden; }
/* ---------- status bar ---------- */

.i-f { left: 37%; font-size: .85em; } .i-e { left: 48%; } .i-c { left: 58%; } .i-h { left: 77%; letter-spacing: .1em; }

i.v, .v { font-style: italic; font-family: "Times New Roman", "STIX Two Text", serif; font-weight: 600; }
b.pi { font-family: "Times New Roman", serif; font-style: normal; font-weight: 700; }

<body>

<div id="dev">
  <div id="top"><span class="model">fx-9910CW</span><span class="ed">Practice simulator</span></div>
  <div id="bezel"><div id="lcd"><div id="st"></div><div id="scr"></div></div></div>

  <div id="disc">Built from the fx-9910CW User's Guide. Not made by or affiliated with Casio.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script>
"use strict";
if (typeof Decimal === 'undefined') { document.getElementById('scr').textContent = 'The math library did not load. Check the connection and reload.'; throw new Error('decimal.js missing'); }
/* ===================== core helpers ===================== */
class CalcError extends Error {
  constructor(kind, pos) { super(kind); this.kind = kind; this.pos = pos; }
}
const ERR = (kind, pos) => new CalcError(kind, pos);
const bigAbs = (a) => (a < 0n ? -a : a);
function bgcd(a, b) { a = bigAbs(a); b = bigAbs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
const BIG_LIMIT = 10n ** 30n;

/* exact rational */
class Q {
  constructor(n, d = 1n) {
    if (d === 0n) throw ERR('Math');
    if (d < 0n) { n = -n; d = -d; }
    const g = bgcd(n, d);
    if (g > 1n) { n /= g; d /= g; }
    this.n = n; this.d = d;
  }
  static int(k) { return new Q(BigInt(k)); }
  static fromDec(str) { // "12.50", "1e-3" style strings, exact
    let s = String(str).trim(), neg = false;
    if (s[0] === '-') { neg = true; s = s.slice(1); }
    let ex = 0; const ei = s.search(/e/i);
    if (ei >= 0) { ex = parseInt(s.slice(ei + 1), 10); s = s.slice(0, ei); }
    let [ip, fp = ''] = s.split('.');
    if (ip === '') ip = '0';
    let n = BigInt(ip + fp), d = 10n ** BigInt(fp.length);
    if (ex > 0) n *= 10n ** BigInt(ex); else if (ex < 0) d *= 10n ** BigInt(-ex);
    return new Q(neg ? -n : n, d);
  }
  add(o) { return new Q(this.n * o.d + o.n * this.d, this.d * o.d); }
  sub(o) { return new Q(this.n * o.d - o.n * this.d, this.d * o.d); }
  mul(o) { return new Q(this.n * o.n, this.d * o.d); }
  div(o) { return new Q(this.n * o.d, this.d * o.n); }
  neg() { return new Q(-this.n, this.d); }
  isZero() { return this.n === 0n; }
  isInt() { return this.d === 1n; }
  sign() { return this.n > 0n ? 1 : this.n < 0n ? -1 : 0; }
  big() { return bigAbs(this.n) > BIG_LIMIT || this.d > BIG_LIMIT; }
  num() { return Number(this.n) / Number(this.d); }
  eq(o) { return this.n === o.n && this.d === o.d; }
}

/* squarefree split of a positive integer (Number): r = s*s*k  -> [s, k] */
function sqFree(r) {
  let s = 1, k = r;
  for (let p = 2; p * p <= k; p++) {
    while (k % (p * p) === 0) { k /= p * p; s *= p; }
  }
  return [s, k];
}

/* ===================== exact values =====================
   Ex = {t:[[Q, rad(Number)]...]}  (sum of q*sqrt(rad), rad squarefree, rad 1 = rational)
   or  {pi: Q}                      (q*pi)
   null = no exact form */
const Ex = {
  rat(q) { return q.isZero() ? { t: [] } : { t: [[q, 1]] }; },
  int(k) { return Ex.rat(Q.int(k)); },
  pi(q) { return q.isZero() ? { t: [] } : { pi: q }; },
  isRat(a) { return a && a.t && (a.t.length === 0 || (a.t.length === 1 && a.t[0][1] === 1)); },
  ratOf(a) { return a.t.length ? a.t[0][0] : new Q(0n); },
  value(a) {
    if (!a) return NaN;
    if (a.pi) return a.pi.num() * Math.PI;
    let v = 0; for (const [q, r] of a.t) v += q.num() * (r === 1 ? 1 : Math.sqrt(r));
    return v;
  },
  norm(terms) {
    const m = new Map();
    for (const [q, r] of terms) {
      if (!Number.isSafeInteger(r) || r > 1e9) return null;
      const prev = m.get(r); m.set(r, prev ? prev.add(q) : q);
    }
    const out = [];
    for (const [r, q] of m) { if (!q.isZero()) { if (q.big()) return null; out.push([q, r]); } }
    if (out.length > 2) return null;
    out.sort((a, b) => a[1] - b[1]);
    return { t: out };
  },
  add(a, b) {
    if (!a || !b) return null;
    if (a.pi || b.pi) {
      if (a.pi && b.pi) return Ex.pi(a.pi.add(b.pi));
      const other = a.pi ? b : a;
      if (other.t && other.t.length === 0) return a.pi ? a : b;
      return null;
    }
    return Ex.norm([...a.t, ...b.t]);
  },
  neg(a) { if (!a) return null; if (a.pi) return { pi: a.pi.neg() }; return { t: a.t.map(([q, r]) => [q.neg(), r]) }; },
  sub(a, b) { return Ex.add(a, Ex.neg(b)); },
  mul(a, b) {
    if (!a || !b) return null;
    if (a.pi || b.pi) {
      if (a.pi && b.pi) return null;
      const p = a.pi ? a : b, o = a.pi ? b : a;
      if (!Ex.isRat(o)) return null;
      const r = p.pi.mul(Ex.ratOf(o)); return r.big() ? null : Ex.pi(r);
    }
    const terms = [];
    for (const [q1, r1] of a.t) for (const [q2, r2] of b.t) {
      let r = r1 * r2; if (r > 1e12) return null;
      const [s, k] = sqFree(r);
      terms.push([q1.mul(q2).mul(Q.int(s)), k]);
    }
    return Ex.norm(terms);
  },
  inv(a) {
    if (!a || a.pi) return null;
    const t = a.t;
    if (t.length === 0) throw ERR('Math');
    if (t.length === 1) { const [q, r] = t[0]; return Ex.norm([[new Q(1n).div(q.mul(Q.int(r))), r]]); }
    const [[p, r1], [q, r2]] = t;
    // (p*sqrt(r1) + q*sqrt(r2))^-1 = (p sqrt r1 - q sqrt r2)/(p^2 r1 - q^2 r2)
    const den = p.mul(p).mul(Q.int(r1)).sub(q.mul(q).mul(Q.int(r2)));
    if (den.isZero()) return null;
    const inv = new Q(1n).div(den);
    return Ex.norm([[p.mul(inv), r1], [q.neg().mul(inv), r2]]);
  },
  div(a, b) {
    if (!a || !b) return null;
    if (b.pi) { if (a.pi) { const r = a.pi.div(b.pi); return Ex.rat(r); } return null; }
    if (Ex.isRat(b) && Ex.ratOf(b).isZero()) throw ERR('Math');
    return Ex.mul(a, Ex.inv(b));
  },
  sqrt(a) {
    if (!Ex.isRat(a)) return null;
    const q = Ex.ratOf(a);
    if (q.sign() < 0) return null;
    if (q.isZero()) return { t: [] };
    const nd = q.n * q.d; if (nd > 10n ** 12n) return null;
    const [s, k] = sqFree(Number(nd));
    return Ex.norm([[new Q(BigInt(s), q.d), k]]);
  },
  powInt(a, k) {
    if (!a) return null;
    if (!Number.isInteger(k) || Math.abs(k) > 64) return null;
    if (k === 0) return Ex.int(1);
    let base = k < 0 ? Ex.inv(a) : a, e = Math.abs(k), res = Ex.int(1);
    while (e > 0 && base && res) {
      if (e & 1) res = Ex.mul(res, base);
      e >>= 1; if (e) base = Ex.mul(base, base);
    }
    return res || null;
  },
  isZero(a) { return a && a.t && a.t.length === 0; },
  eq(a, b) {
    if (!a || !b) return false;
    if (a.pi || b.pi) return !!(a.pi && b.pi && a.pi.eq(b.pi));
    if (a.t.length !== b.t.length) return false;
    return a.t.every((x, i) => x[1] === b.t[i][1] && x[0].eq(b.t[i][0]));
  },
  ser(a) { if (!a) return null; if (a.pi) return { pi: [String(a.pi.n), String(a.pi.d)] }; return { t: a.t.map(([q, r]) => [String(q.n), String(q.d), r]) }; },
  de(o) { if (!o) return null; if (o.pi) return { pi: new Q(BigInt(o.pi[0]), BigInt(o.pi[1])) }; return { t: o.t.map(([n, d, r]) => [new Q(BigInt(n), BigInt(d)), r]) }; },
};

/* exact sin values at multiples of 15 degrees */
const SIN15 = (() => {
  const h = new Q(1n, 2n), q4 = new Q(1n, 4n);
  return {
    0: Ex.int(0), 15: Ex.norm([[q4, 6], [q4.neg(), 2]]), 30: Ex.rat(h), 45: Ex.norm([[h, 2]]),
    60: Ex.norm([[h, 3]]), 75: Ex.norm([[q4, 6], [q4, 2]]), 90: Ex.int(1),
  };
})();
/* seeded PRNG for Ran# and Math Box */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RNG = mulberry32((Date.now() ^ 0x9e3779b9) >>> 0);

/* ===================== 23-digit decimal arithmetic =====================
   Dm holds calculator values (23 significant digits, round half up).
   Dh carries guard digits for intermediate steps. */
const Dm = Decimal.clone({ precision: 23, rounding: Decimal.ROUND_HALF_UP });
const Dh = Decimal.clone({ precision: 34, rounding: Decimal.ROUND_HALF_UP });
const isDec = (v) => Decimal.isDecimal(v);
const D0 = new Dm(0), D1 = new Dm(1);
const PI_D = new Dm('3.1415926535897932384626');   // the calculator's internal π
const E_D = new Dm('2.7182818284590452353602');    // the calculator's internal e
const PI_H = Dh.acos(-1);
const toDm = (h) => new Dm(h).toSD(23);
const numD = (v) => new Dm(v);                      // double -> decimal (shortest round-trip digits)
const qH = (q) => new Dh(q.n.toString()).div(q.d.toString());
/* exact form -> 23-digit decimal */
function exToD(x) {
  if (!x) return null;
  if (x.pi) return toDm(new Dh(x.pi.n.toString()).times(PI_D).div(x.pi.d.toString()));
  let s = new Dh(0);
  for (const [q, r] of x.t) { let t = qH(q); if (r !== 1) t = t.times(new Dh(r).sqrt()); s = s.plus(t); }
  return toDm(s);
}

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ===================== settings & memory ===================== */
const DEFAULT_SETTINGS = () => ({
  io: 'MM', angle: 'D', fmt: { t: 'norm', n: 1 }, engSym: false, frac: 'improper', cplx: 'rect',
  decMark: 'dot', digitSep: false, x10: 'sci', fmtKey: 'dec',
  contrast: 5, apo: 10, mlFont: 'normal', showNum: true, qr: 11,
});
const VARNAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'x', 'y', 'z'];
const R0 = () => ({ t: 'r', v: 0, x: Ex.int(0) });
const DEFAULT_MEM = () => {
  const vars = {}; VARNAMES.forEach((n) => (vars[n] = R0()));
  return {
    vars, ans: R0(), fx: null, gx: null,
    mats: { A: null, B: null, C: null, D: null }, matAns: null,
    vcts: { A: null, B: null, C: null, D: null }, vctAns: null,
    stat: { type: '1', freq: false, rows: [] },
    dist: { x: 0, N: 0, p: 0, 'μ': 0, 'σ': 1, Lower: 0, Upper: 0, Area: 0, 'λ': 0 },
    distList: [],
    table: { start: 1, end: 5, step: 1, type: 'fg', rows: [] },
    sheet: { cells: {}, autoCalc: true, showCell: 'formula' },
    eqnComplexRoots: true,
    mbox: { dice: 1, coins: 1, attempts: 5, same: 0 },
    lastApp: 0,
  };
};
let S = DEFAULT_SETTINGS();
let M = DEFAULT_MEM();

/* stored values keep their 23-digit decimals as strings (s, sr, si) */
const dStr = (d) => (d && d.isFinite() ? d.toString() : null);
function serVal(v) {
  if (!v) return null;
  if (v.t === 'r') return { t: 'r', v: v.v, x: Ex.ser(v.x), d: v.dec ? 1 : 0, s: dStr(Dv(v)), lo: v.lo ? 1 : 0 };
  if (v.t === 'c') return { t: 'c', re: v.re, im: v.im, xr: Ex.ser(v.xr), xi: Ex.ser(v.xi), sr: dStr(DR(v)), si: dStr(DI(v)), d: v.dec ? 1 : 0, lo: v.lo ? 1 : 0 };
  if (v.t === 'm') return { t: 'm', r: v.r, c: v.c, a: v.a.map((row) => row.map(serVal)) };
  if (v.t === 'v') return { t: 'v', n: v.n, a: v.a.map(serVal) };
  return null;
}
function deVal(o) {
  if (!o) return null;
  if (o.t === 'r') { const r = { t: 'r', v: o.v, x: Ex.de(o.x), dec: !!o.d, lo: !!o.lo }; if (o.s) r.d = new Dm(o.s); return r; }
  if (o.t === 'c') { const c = { t: 'c', re: o.re, im: o.im, xr: Ex.de(o.xr), xi: Ex.de(o.xi), dec: !!o.d, lo: !!o.lo }; if (o.sr) c.dr = new Dm(o.sr); if (o.si) c.di = new Dm(o.si); return c; }
  if (o.t === 'm') return { t: 'm', r: o.r, c: o.c, a: o.a.map((row) => row.map(deVal)) };
  if (o.t === 'v') return { t: 'v', n: o.n, a: o.a.map(deVal) };
  return null;
}
function saveAll() {
  try {
    const m = {
      vars: Object.fromEntries(VARNAMES.map((n) => [n, serVal(M.vars[n])])), ans: serVal(M.ans),
      fx: M.fx, gx: M.gx,
      mats: Object.fromEntries('ABCD'.split('').map((k) => [k, serVal(M.mats[k])])), matAns: serVal(M.matAns),
      vcts: Object.fromEntries('ABCD'.split('').map((k) => [k, serVal(M.vcts[k])])), vctAns: serVal(M.vctAns),
      stat: M.stat, dist: M.dist, distList: M.distList, table: { ...M.table, rows: [] },
      sheet: M.sheet, eqnComplexRoots: M.eqnComplexRoots, mbox: M.mbox, lastApp: M.lastApp,
    };
    localStorage.setItem('fx9910sim2', JSON.stringify({ S, m }));
  } catch (e) { /* storage unavailable */ }
}
function loadAll() {
  try {
    const j = localStorage.getItem('fx9910sim2'); if (!j) return false;
    const o = JSON.parse(j);
    S = Object.assign(DEFAULT_SETTINGS(), o.S || {});
    const d = DEFAULT_MEM(), m = o.m || {};
    VARNAMES.forEach((n) => { d.vars[n] = deVal(m.vars && m.vars[n]) || R0(); });
    d.ans = deVal(m.ans) || R0(); d.fx = m.fx || null; d.gx = m.gx || null;
    'ABCD'.split('').forEach((k) => { d.mats[k] = deVal(m.mats && m.mats[k]); d.vcts[k] = deVal(m.vcts && m.vcts[k]); });
    d.matAns = deVal(m.matAns); d.vctAns = deVal(m.vctAns);
    if (m.stat) d.stat = m.stat; if (m.dist) Object.assign(d.dist, m.dist); if (m.distList) d.distList = m.distList;
    if (m.table) Object.assign(d.table, m.table, { rows: [] });
    if (m.sheet) d.sheet = m.sheet; if (m.eqnComplexRoots !== undefined) d.eqnComplexRoots = m.eqnComplexRoots;
    if (m.mbox) d.mbox = m.mbox; d.lastApp = m.lastApp || 0;
    M = d; return true;
  } catch (e) { return false; }
}

/* ===================== tokens ===================== */
const TK = {};
function tk(id, k, d, l, extra) { TK[id] = Object.assign({ k, d, l: l === undefined ? d : l }, extra || {}); }
'0123456789'.split('').forEach((c) => tk(c, 'dig', c));
tk('.', 'dig', '.');
'ABCDEF'.split('').forEach((c) => tk('h' + c, 'hex', '<b class="hx">' + c + '</b>'));
tk('+', 'op', '+'); tk('−', 'op', '−'); tk('×', 'op', '×'); tk('÷', 'op', '÷');
tk('NEG', 'neg', '<span class="ng">-</span>');
tk('(', 'lp', '('); tk(')', 'rp', ')'); tk(',', 'comma', ',');
tk('=', 'eq', '='); tk(':', 'colon', ':'); tk('$', 'dollar', '$');
tk('⌟', 'lfrac', '<span class="lf">⌟</span>');
tk('SCI', 'sciE', '<span class="x10s">×<small>10</small></span>');
tk('^(', 'pow', '^(');
tk('ˣ√(', 'xrt', '<sup class="v">x</sup>√(');
/* functions */
const FN = (id, f, ar, d) => tk(id, 'fn', d || esc(id), undefined, { f, ar });
FN('sin(', 'sin', [1, 1]); FN('cos(', 'cos', [1, 1]); FN('tan(', 'tan', [1, 1]);
FN('sin⁻¹(', 'asin', [1, 1], 'sin<sup>-1</sup>('); FN('cos⁻¹(', 'acos', [1, 1], 'cos<sup>-1</sup>('); FN('tan⁻¹(', 'atan', [1, 1], 'tan<sup>-1</sup>(');
FN('sinh(', 'sinh', [1, 1]); FN('cosh(', 'cosh', [1, 1]); FN('tanh(', 'tanh', [1, 1]);
FN('sinh⁻¹(', 'asinh', [1, 1], 'sinh<sup>-1</sup>('); FN('cosh⁻¹(', 'acosh', [1, 1], 'cosh<sup>-1</sup>('); FN('tanh⁻¹(', 'atanh', [1, 1], 'tanh<sup>-1</sup>(');
FN('log(', 'log', [1, 2]); FN('ln(', 'ln', [1, 1]);
FN('√(', 'sqrt', [1, 1]);
FN('Abs(', 'abs', [1, 1]); FN('Rnd(', 'rnd', [1, 1]); FN('RanInt#(', 'ranint', [2, 2]);
FN('Pol(', 'pol', [2, 2]); FN('Rec(', 'rec', [2, 2]);

function openCatalog(list) {

class VarScreen {
  constructor(lock, storeFn) { this.isMenu = true; this.sel = 0; this.lock = lock; this.storeFn = storeFn; this.edit = null; }
  key(k) {
    if (this.edit) {
      const ed = this.edit;
      if (k === 'EXE' || k === 'OK') {
        try { const { toks } = ed.flatten(); const ast = parseTokens(toks, {}); const v = evaluate(ast, { cplx: !!(inputTarget() && inputTarget().catCtx && inputTarget().catCtx().cplx) }); if (v.t !== 'r' && v.t !== 'c') throw ERR('Syntax'); M.vars[VARNAMES[this.sel]] = v; saveAll(); this.edit = null; }
        catch (e) { showError(e, () => {}); }
        return;
      }
      if (k === 'AC' || k === 'BACK') { this.edit = null; return; }
      if (k === 'DEL') { ed.del(); return; } if (k === 'LEFT') { ed.left(); return; } if (k === 'RIGHT') { ed.right(); return; }
      const d = keyInput(k, { math: false }); if (d) applyInput(ed, d);
      return;
    }
    if (k === 'UP') { this.sel = this.sel >= 2 ? this.sel - 2 : this.sel; return; }
    if (k === 'DOWN') { this.sel = this.sel + 2 <= 8 ? this.sel + 2 : this.sel; return; }
    if (k === 'LEFT') { if (this.sel % 2) this.sel--; return; }
    if (k === 'RIGHT') { if (this.sel % 2 === 0 && this.sel < 8) this.sel++; return; }
    if (k === 'BACK' || k === 'AC') { pop(); return; }
    const name = VARNAMES[this.sel];
    if (k === 'OK' || k === 'EXE') {
      const items = [];
      items.push({ label: 'Store', act: () => { const v = this.storeFn ? this.storeFn() : M.ans; if (v) { M.vars[name] = v; saveAll(); } popMenus(); } });
      const t = inputTarget();
      items.push({ label: 'Recall', act: () => { popMenus(); const tt = inputTarget(); if (tt && tt.insertInput) tt.insertInput({ toks: [name] }); } });
      if (!this.lock) items.push({ label: 'Edit', act: () => { pop(); this.edit = new Editor(false); } });
      push(new Menu(items, { title: name + '=' }));
      return;
    }
    if (!this.lock) { const d = keyInput(k, { math: false }); if (d && d.toks && !d.tpl) { this.edit = new Editor(false); applyInput(this.edit, d); } }
  }
  render() {
    if (this.edit) return '<div class="vedit">' + VARNAMES[this.sel].replace(/[xyz]/, (c) => '<i class="v">' + c + '</i>') + '=' + this.edit.render(true) + '</div>';
    let h = '<div class="vars">';
    VARNAMES.forEach((n, i) => {
      const v = M.vars[n]; const txt = v.t === 'c' ? complexHTML(v, 'dec', 'dec') : decHTML(v, { fmt: { t: 'norm', n: 1 }, noEngSym: true });
      h += '<div class="vi' + (i === this.sel ? ' sel' : '') + '">' + (/[xyz]/.test(n) ? '<i class="v">' + n + '</i>' : n) + '=' + txt + (i === this.sel && this.lock ? '<span class="lk">🔒</span>' : '') + '</div>';
    });
    return h + '</div>';
  }
  status() { return {}; }
}

class FuncDefScreen {
  constructor(which) { this.which = which; this.ed = new Editor(S.io[0] === 'M'); this.isMenu = false; const cur = which === 'f' ? M.fx : M.gx; if (cur && cur.math === this.ed.math) this.ed.setTree(cur.tree); }
  accepts() { return true; }
  catCtx() { return { math: this.ed.math, polrec: true, fdef: this.which }; }
  insertInput(d) { applyInput(this.ed, d); }
  key(k) {
    const ed = this.ed;
    if (k === 'EXE' || k === 'OK') {
      const tree = ed.getTree();
      if (tree.length === 0) { if (this.which === 'f') M.fx = null; else M.gx = null; }
      else {
        try { const { toks } = ed.flatten(); parseTokens(toks, {}); }
        catch (e) { showError(e, () => ed.placeError(ed.flatten().locs, e.pos)); return; }
        const def = { tree, math: ed.math }; if (this.which === 'f') M.fx = def; else M.gx = def;
      }
      FG_CACHE.clear(); saveAll(); pop(); if (this.after) this.after(); return;
    }
    if (k === 'BACK') { pop(); return; }
    if (k === 'AC') { ed.clear(); return; }
    if (editKey(ed, k, this.catCtx())) return;
  }
  render() { return '<div class="fdef">' + this.which + '(<i class="v">x</i>)=' + this.ed.render(true) + '</div>'; }
  status() { return { math: this.ed.math }; }
}

/* ---------- common editing keys ---------- */
function editKey(ed, k, ctx) {
  switch (k) {
    case 'LEFT': ed.left(); return true;
    case 'RIGHT': ed.right(); return true;
    case 'JL': ed.jumpOut(-1); return true;
    case 'JR': ed.jumpOut(1); return true;
    case 'UP': return ed.vert('up');
    case 'DOWN': return ed.vert('down');
    case 'PGUP': ed.home(); return true;
    case 'PGDN': ed.end(); return true;
    case 'DEL': ed.del(); return true;
    case 'INS': if (ed.math) ed.wrap = !ed.wrap; else ed.ow = !ed.ow; return true;
  }
  const d = keyInput(k, ctx);
  if (d) { applyInput(ed, d); return true; }
  return false;
}

    if (this.r < this.top) this.top = this.r; if (this.r >= this.top + 4) this.top = this.r - 3;
    let h = '<table class="tb mb"><tr><th class="rn"></th>' + cols.map((c) => '<th>' + c + '</th>').join('') + '</tr>';
    for (let i = this.top; i < Math.min(this.rolls.length, this.top + 4); i++) {
      const r = this.rolls[i]; const cells = r.map((x) => (isD ? x : x ? '●' : '○'));
      if (isD && n >= 2) cells.push(r.reduce((a, b) => a + b, 0)); if (isD && n === 2) cells.push(Math.abs(r[0] - r[1])); if (!isD && n >= 2) cells.push(r.reduce((a, b) => a + b, 0));
      h += '<tr><td class="rn">' + (i + 1) + '</td>' + cells.map((c) => '<td class="' + (i === this.r ? 'hl' : '') + '">' + c + '</td>').join('') + '</tr>';
    }
    return h + '</table>';
  }
  status() { return { math: S.io[0] === 'M' }; }
}
class MBoxFreq {
  constructor(kind, n, rolls, mode) {
    this.isMenu = false; this.r = 0; this.top = 0; this.att = rolls.length; this.mode = mode;
    let keys, val;
    if (kind === 'dice') {
      if (mode === 'diff') { keys = [0, 1, 2, 3, 4, 5]; val = (r) => Math.abs(r[0] - r[1]); }
      else { keys = []; for (let s = n; s <= 6 * n; s++) keys.push(s); val = (r) => r.reduce((a, b) => a + b, 0); }
    } else if (n === 1) { keys = ['●', '○']; val = (r) => (r[0] ? '●' : '○'); }
    else { keys = []; for (let s = 0; s <= n; s++) keys.push(s); val = (r) => r.reduce((a, b) => a + b, 0); }
    this.rows = keys.map((k) => { const f = rolls.filter((r) => val(r) === k).length; return [k, f, f / rolls.length]; });
    this.head = kind === 'dice' ? (mode === 'diff' ? 'Diff' : 'Sum') : 'Side'; this.coin = kind === 'coin' && n > 1;
  }
  storeValue() { return mkR(this.rows[this.r][2]); }
  key(k) { if (k === 'UP') this.r = Math.max(0, this.r - 1); else if (k === 'DOWN') this.r = Math.min(this.rows.length - 1, this.r + 1); else if (k === 'BACK' || k === 'AC') pop(); }
  render() {
    if (this.r < this.top) this.top = this.r; if (this.r >= this.top + 4) this.top = this.r - 3;
    let h = '<div class="mbf"><table class="tb mbt"><tr><th>' + this.head + '</th><th>Freq</th><th>Rel Fr</th></tr>';
    for (let i = this.top; i < Math.min(this.rows.length, this.top + 4); i++) {
      const [k, f, rf] = this.rows[i];
      h += '<tr><td>' + (this.coin ? '●×' + k : k) + '</td><td>' + f + '</td><td' + (i === this.r ? ' class="sel"' : '') + '>' + cellText(Number(rf.toPrecision(6))) + '</td></tr>';
    }
    h += '</table><div class="mba">Attempts<br>' + this.att + '</div></div><div class="bot">' + decHTML(this.rows[this.r][2]) + '</div>';
    return h;
  }
  status() { return { math: S.io[0] === 'M' }; }
}

}

function resetSettingsData() {
  const k = keepSys(); S = Object.assign(DEFAULT_SETTINGS(), k);

}
function initializeAll() { const k = keepSys(); S = Object.assign(DEFAULT_SETTINGS(), k); M = DEFAULT_MEM(); FG_CACHE.clear(); saveAll(); curApp = 0; goHome(); }
function onKeyReset() {
  M.fx = null; M.gx = null; FG_CACHE.clear(); M.sheet.cells = {}; M.table.rows = []; saveAll();

  stack = [baseScreenFor(curApp)];
}
let lastKey = Date.now();

function press(id) {
  lastKey = Date.now();
  if (!powerOn) { if (id === 'ON') { powerOn = true; } renderAll(); return; }
  if (id === 'SHIFT') { shiftOn = !shiftOn; renderAll(); return; }
  let k = id;
  if (shiftOn) { k = SHIFTMAP[id] || id; shiftOn = false; }
  const t = topS();
  try {
    if (t instanceof ErrorScreen && !['OK', 'EXE', 'AC', 'BACK', 'ON', 'HOME', 'OFF', 'QR'].includes(k)) { renderAll(); return; }
    if (k === 'OFF') { powerOff(); }
    else if (k === 'ON') onKeyReset();
    else if (k === 'HOME') goHome();
    else if (k === 'SETTINGS') { if (t instanceof HomeScreen) push(new GetStarted()); else if (!(t instanceof ErrorScreen) && !(t instanceof MBoxBusy)) push(settingsMenu()); }
    else if (k === 'VARIABLE') {
      if (!(t instanceof HomeScreen) && !(t instanceof VarScreen)) {
        let base = null; for (let i = stack.length - 1; i >= 0; i--) if (!stack[i].isMenu) { base = stack[i]; break; }
        const lock = base && base.lockVars ? base.lockVars() : false;
        push(new VarScreen(lock, base && base.storeValue ? () => base.storeValue() : null));
      }
    }
    else if (k === 'FUNCTION') { if (FUNC_APPS.has(APPS[curApp][1]) && (inputTarget() || t instanceof TableScreen) && !(t instanceof HomeScreen)) openFunctionMenu(); }
    else if (k === 'CATALOG' || k === 'CATLIST') { if (!(t instanceof HomeScreen)) openCatalog(k === 'CATLIST'); }
    else if (k === 'QR') push(new QRScreen());
    else if (t.key) t.key(k);
  } catch (e) { if (e instanceof CalcError) showError(e, () => {}); else console.error(e); }
  renderAll();
}
setInterval(() => { if (powerOn && Date.now() - lastKey > S.apo * 60000) { powerOff(); renderAll(); } }, 30000);

/* ===================== render ===================== */
function renderAll() {
  const lcd = document.getElementById('lcd'), st = document.getElementById('st'), scr = document.getElementById('scr');
  lcd.classList.toggle('off', !powerOn);
  lcd.style.setProperty('--ink', 'rgba(14,22,10,' + (0.55 + S.contrast * 0.045).toFixed(3) + ')');
  if (!powerOn) { st.innerHTML = ''; scr.innerHTML = ''; return; }
  const s = topS(); const status = (s.status && s.status()) || {};
  const app = APPS[curApp][1];
  let h = '';

  if (status.math && S.io[0] === 'M') h += '<span class="i i-m"><svg viewBox="0 0 22 10"><path d="M1 6l2 3 3-8h5"/><rect x="11.5" y="2.5" width="4" height="6"/><path d="M17 9l4-7"/></svg></span>';
  h += '<span class="i i-a">' + S.angle + '</span>';
  if (S.fmt.t === 'fix') h += '<span class="i i-f">FIX</span>'; else if (S.fmt.t === 'sci') h += '<span class="i i-f">SCI</span>';
  if (S.engSym) h += '<span class="i i-e">E</span>';
  if (status.cplx || (app === 'cplx' && !(s instanceof HomeScreen))) h += '<span class="i i-c">' + (S.cplx === 'polar' ? '∠' : '<b class="ii">i</b>') + '</span>';
  if (status.up || status.down) h += '<span class="i i-h">' + (status.down ? '▼' : '') + (status.up ? '▲' : '') + '</span>';
  st.innerHTML = h;

  // keep cursor visible in horizontally scrolling expression lines

    const c = box.querySelector('.cur'); if (!c) return;
    const br = box.getBoundingClientRect(), cr = c.getBoundingClientRect();

}

const BOX = '<i class="bx"></i>';
const KEYS6 = [

  [['X', '<i class="kx">x</i>', '', '', 'QR'], ['FRAC', '<span class="kfr">' + BOX + '<b></b>' + BOX + '</span>', '', '', '<span class="sfr">' + BOX + '<span class="kfr sm">' + BOX + '<b></b>' + BOX + '</span></span>'], ['SQRT', '√' + BOX, '', '', '<sup>' + BOX + '</sup>√' + BOX], ['POW', BOX + '<sup>' + BOX + '</sup>', '', '', BOX + '<sup>-1</sup>'], ['SQ', BOX + '<sup>2</sup>', '', '', 'log'], ['LOGAB', 'log' + '<sub>' + BOX + '</sub>' + BOX, '', 'ks', 'ln']],

];

  [['4', '4', '', 'num', 'A'], ['5', '5', '', 'num', 'B'], ['6', '6', '', 'num', 'C'], ['MUL', '×', '', 'num'], ['DIV', '÷', '', 'num']],

function buildPad() {
  const mk = (rows, el, cls) => {
    const g = document.getElementById(el);
    rows.forEach((row, ri) => row.forEach((k, ci) => {
      const cell = document.createElement('div'); cell.className = 'cell ' + (cls || '');
      cell.style.gridRow = String(ri + 1); cell.style.gridColumn = String(ci + 1);
      if (!k) { g.appendChild(cell); return; }
      const [id, face, label, kc, sh] = k;
      if (id === 'PGUP') { cell.style.gridRow = '1 / span 2'; cell.className += ' rock'; }
      if (id === 'PGDN') { return; }
      if (label) { const l = document.createElement('div'); l.className = 'lab' + (id === 'SHIFT' ? ' gold' : ''); l.textContent = label; cell.appendChild(l); }
      if (sh) { const s = document.createElement('div'); s.className = 'sh'; s.innerHTML = sh; cell.appendChild(s); }
      if (id === 'PGUP') {
        const r = document.createElement('div'); r.className = 'rocker';
        ['PGUP', 'PGDN'].forEach((pid) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'k pgk'; b.dataset.k = pid; b.innerHTML = ICONS[pid]; b.setAttribute('aria-label', pid === 'PGUP' ? 'Page up' : 'Page down'); r.appendChild(b); });
        cell.appendChild(r); g.appendChild(cell); return;
      }
      const b = document.createElement('button'); b.type = 'button'; b.className = 'k ' + (kc || ''); b.dataset.k = id; b.innerHTML = face;
      b.setAttribute('aria-label', id); cell.appendChild(b); g.appendChild(cell);
    }));
  };
  mk(KEYS6, 'pad6'); mk(KEYS5, 'pad5');

  const down = (e) => { const b = e.target.closest('.k'); if (!b) return; e.preventDefault(); b.classList.add('dn'); try { navigator.vibrate && navigator.vibrate(8); } catch (x) {} press(b.dataset.k); };
  pad.addEventListener('pointerdown', down);
  const up = () => pad.querySelectorAll('.k.dn').forEach((b) => b.classList.remove('dn'));
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => pad.addEventListener(t, up));
  pad.addEventListener('contextmenu', (e) => e.preventDefault());
}
const KB = {
  Enter: 'EXE', '=': 'EXE', Backspace: 'DEL', Delete: 'DEL', Escape: 'AC', ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT',
  PageUp: 'PGUP', PageDown: 'PGDN', Home: 'HOME', '+': 'ADD', '-': 'SUB', '*': 'MUL', '/': 'DIV', '^': 'POW', '(': 'LP', ')': 'RP', '.': 'DOT', x: 'X', Shift: null,
